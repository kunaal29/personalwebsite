<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --ink:#000000;
    --display:"Instrument Serif","Times New Roman",Times,Georgia,serif;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--mono);
    font-size:14px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{background:var(--ink);color:var(--paper);}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

  .frame{
    border:1px solid var(--ink);
    margin:0.75rem 0.75rem 0;
  }

  /* ---------- masthead ---------- */

  .bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:1rem;
    padding:0.5rem 1rem;
    border-bottom:1px solid var(--ink);
    font-size:0.625rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
  }

  .masthead{
    padding:2.75rem 1.25rem 2rem;
    border-bottom:1px solid var(--ink);
  }

  .masthead h1{
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(2.5rem,11vw,4.5rem);
    line-height:0.92;
    letter-spacing:-0.015em;
    margin:0 0 0.9rem;
  }

  .masthead p{
    font-size:0.8125rem;
    max-width:30rem;
    margin:0;
  }

  /* ---------- filter ---------- */

  .filter{
    display:flex;
    border-bottom:1px solid var(--ink);
  }

  .filter button{
    flex:1;
    font-family:var(--mono);
    font-size:0.625rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    background:var(--paper);
    color:var(--ink);
    border:none;
    border-right:1px solid var(--ink);
    border-radius:0;
    padding:0.7rem 0.4rem;
    cursor:pointer;
  }
  .filter button:last-child{border-right:none;}
  .filter button:hover{background:#f0f0f0;}
  .filter button[aria-pressed="true"]{background:var(--ink);color:var(--paper);}

  /* ---------- entries ---------- */

  .entry{
    display:grid;
    grid-template-columns:1fr;
    gap:0;
    border-bottom:1px solid var(--ink);
    padding:1.5rem 1.25rem 1.75rem;
  }

  @media (min-width:760px){
    .entry{
      grid-template-columns:9rem 1fr;
      gap:2rem;
      padding:1.75rem 1.5rem 2rem;
    }
  }

  .entry__rail{
    font-size:0.625rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    padding-bottom:0.75rem;
  }

  @media (min-width:760px){
    .entry__rail{padding-bottom:0;}
  }

  .entry__rail .tag{
    display:inline-block;
    border:1px solid var(--ink);
    padding:0.1rem 0.4rem;
    margin-top:0.45rem;
  }

  .entry__body h2{
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(1.5rem,4.5vw,2.125rem);
    line-height:1.05;
    letter-spacing:-0.01em;
    margin:0 0 0.35rem;
  }

  .entry__meta{
    font-size:0.6875rem;
    letter-spacing:0.06em;
    margin:0 0 0.9rem;
    opacity:0.7;
  }

  .entry__body p{
    font-size:0.8125rem;
    line-height:1.75;
    max-width:34rem;
    margin:0 0 0.8rem;
  }
  .entry__body p:last-child{margin-bottom:0;}

  .empty{
    padding:3rem 1.5rem;
    font-size:0.8125rem;
    border-bottom:1px solid var(--ink);
  }

  footer{
    padding:0.5rem 1rem;
    display:flex;
    justify-content:space-between;
    font-size:0.625rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
  }

  /* ---------- the runner ---------- */

  .runner{
    position:fixed;
    left:0;right:0;bottom:0;
    height:5rem;
    pointer-events:none;
    z-index:40;
    background:linear-gradient(to top, var(--paper) 55%, rgba(255,255,255,0));
  }

  .runner__ground{
    position:absolute;
    left:0.75rem;right:0.75rem;bottom:1.5rem;
    height:1px;
    background:var(--ink);
  }

  .runner__track{
    position:absolute;
    left:1rem;right:1rem;bottom:1.6rem;
  }

  #dog{
    display:inline-block;
    margin:0;
    font-family:var(--mono);
    font-size:clamp(5px,1.3vw,9px);
    line-height:1.05;
    white-space:pre;
    color:var(--ink);
    transform-origin:50% 50%;
    will-change:transform;
  }

  .spacer{height:6rem;}
</style>
</head>
<body>

<div class="frame">

  <div class="bar">
    <span>Log</span>
    <span id="count">—</span>
  </div>

  <div class="masthead">
    <h1>Notes on<br>books and<br>a house</h1>
    <p>An unsorted record of what I'm reading and what I'm doing to a cottage in Buckinghamshire. Kept mostly so I can remember what I decided and why.</p>
  </div>

  <div class="filter" role="group" aria-label="Filter entries">
    <button type="button" data-filter="all" aria-pressed="true">All</button>
    <button type="button" data-filter="reading" aria-pressed="false">Reading</button>
    <button type="button" data-filter="house" aria-pressed="false">House</button>
  </div>

  <div id="feed"></div>

  <footer>
    <span>Static</span>
    <span>No analytics</span>
  </footer>

</div>

<div class="spacer"></div>

<div class="runner" aria-hidden="true">
  <div class="runner__ground"></div>
  <div class="runner__track"><pre id="dog"></pre></div>
</div>

<script>
/* =====================================================================
   ADD AN ENTRY HERE.

   Newest at the top. Only `date`, `type` and `title` are required.
     date  — YYYY-MM-DD
     type  — "reading" or "house"
     meta  — author + translator, or the room. Optional.
     body  — one string, or an array of strings for multiple paragraphs.

   Everything below this block is machinery. You never need to touch it.
   ===================================================================== */

var ENTRIES = [

  {
    date: "2026-07-22",
    type: "reading",
    title: "Placeholder entry",
    meta: "Author, tr. Translator",
    body: [
      "Replace this with something you actually read. Two or three sentences is plenty — the format works better when entries are short enough that writing one isn't a project.",
      "A second paragraph, to show what that looks like."
    ]
  },

  {
    date: "2026-07-18",
    type: "house",
    title: "Second coat of limewash",
    meta: "Sitting room",
    body: "Placeholder. Notes on what was done, what it cost, and what you'd do differently. The useful entries are usually the ones recording a decision you'll otherwise forget the reasoning for."
  },

  {
    date: "2026-07-11",
    type: "reading",
    title: "Another placeholder",
    meta: "Abandoned at p. 90",
    body: "Abandoned books are worth logging too. They're often more informative than the finished ones."
  },

  {
    date: "2026-07-02",
    type: "house",
    title: "Flooring quotes",
    meta: "Ground floor",
    body: "Placeholder. Three quotes, the spread between them, and which one won."
  }

];

/* ---------------------------------------------------------------- */

(function(){
  "use strict";

  var MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN",
                "JUL","AUG","SEP","OCT","NOV","DEC"];

  var feed    = document.getElementById('feed');
  var countEl = document.getElementById('count');
  var buttons = Array.prototype.slice.call(
                  document.querySelectorAll('.filter button'));

  var active = 'all';

  function formatDate(iso){
    var p = iso.split('-');
    return parseInt(p[2], 10) + ' ' + MONTHS[parseInt(p[1], 10) - 1] + ' ' + p[0];
  }

  function esc(s){
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function paragraphs(body){
    if (!body) return '';
    var arr = Array.isArray(body) ? body : [body];
    return arr.map(function(t){ return '<p>' + esc(t) + '</p>'; }).join('');
  }

  function render(){
    var list = ENTRIES.slice().sort(function(a, b){
      return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0);
    });

    if (active !== 'all'){
      list = list.filter(function(e){ return e.type === active; });
    }

    countEl.textContent = list.length + (list.length === 1 ? ' entry' : ' entries');

    if (!list.length){
      feed.innerHTML = '<div class="empty">Nothing under this filter yet.</div>';
      return;
    }

    feed.innerHTML = list.map(function(e){
      return '<article class="entry">' +
               '<div class="entry__rail">' +
                 formatDate(e.date) +
                 '<br><span class="tag">' + esc(e.type) + '</span>' +
               '</div>' +
               '<div class="entry__body">' +
                 '<h2>' + esc(e.title) + '</h2>' +
                 (e.meta ? '<p class="entry__meta">' + esc(e.meta) + '</p>' : '') +
                 paragraphs(e.body) +
               '</div>' +
             '</article>';
    }).join('');
  }

  buttons.forEach(function(btn){
    btn.addEventListener('click', function(){
      active = btn.getAttribute('data-filter');
      buttons.forEach(function(b){
        b.setAttribute('aria-pressed', String(b === btn));
      });
      render();
      dogRender();
    });
  });

  render();

  /* ---------- scroll-linked runner ---------- */

  var BODY = [
"    /\\_             ______",
"   /   \\___________/      \\",
"   \\                   o   |",
"    |                     _/"
  ];

  var LEGS = [
    ["   /|         |\\      |", "  / |         | \\     |"],
    ["   ||         ||      |", "   ||         ||      |"],
    ["   |\\         /|      |", "   | \\       / |      |"],
    ["   //         \\\\      |", "  //           \\\\     |"]
  ];

  var STAND = ["   ||         ||      |", "   ||         ||      |"];

  var STRIDE  = 34;
  var dog     = document.getElementById('dog');
  var track   = document.querySelector('.runner__track');
  var reduce  = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var lastY = window.scrollY, travelled = 0, frame = 0, facing = 1, ticking = false;

  function draw(legs){ dog.textContent = BODY.concat(legs).join('\n'); }

  function dogRender(){
    ticking = false;

    var y   = window.scrollY;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var p   = max > 0 ? Math.min(Math.max(y / max, 0), 1) : 0;
    var d   = y - lastY;

    if (Math.abs(d) > 0.5){
      facing = d > 0 ? 1 : -1;
      if (!reduce){
        travelled += Math.abs(d);
        if (travelled >= STRIDE){
          var steps = Math.floor(travelled / STRIDE);
          frame = (frame + steps) % LEGS.length;
          travelled -= steps * STRIDE;
          draw(LEGS[frame]);
        }
      }
    }
    lastY = y;

    var span = Math.max(0, track.clientWidth - dog.offsetWidth);
    dog.style.transform =
      'translateX(' + (p * span).toFixed(2) + 'px) scaleX(' + facing + ')';
  }

  function onScroll(){
    if (!ticking){ requestAnimationFrame(dogRender); ticking = true; }
  }

  draw(reduce ? STAND : LEGS[0]);
  window.addEventListener('scroll', onScroll, { passive:true });
  window.addEventListener('resize', dogRender);
  dogRender();
})();
</script>

</body>
</html>
